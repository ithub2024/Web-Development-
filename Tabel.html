<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabel Order</title>
</head>
<style>
    table, tr, td , th {
        border: 1px solid black;
        border-collapse: collapse;   
         }
</style>
<body>
    <div>
        <h1>Tabel 1</h1>
        <table border-collapse:collapse >
            <tr>
                <td>1</td>
                <td>2</td>
                <td>3</td>
            </tr>
            <tr>
                <td>4</td>
                <td>5</td>
                <td>6</td>
            </tr>
            <tr>
                <td>7</td>
                <td>8</td>
                <td>9</td>
            </tr>
        </table>
    </div>
    <div>
        <h1>Score Card</h1>
        <table>
            <thead> 
            <tr>
            <th>Student/Subject</th>
            <th>Maths</th>
            <th>Hindi</th>
            <th>English</th>
            <th>Science</th>
            </tr>
            </thead>

            <tbody> 
            <tr>
            <td>Matka</td>
            <td>90</td>
            <td>50</td>
            <td>59</td>
            <td>60</td>
            </tr>
            <tr>
            <td>Rohan</td>
            <td>97</td>
            <td>92</td>
            <td>91</td>
            <td>88</td>
            </tr>
            <tr>
            <td>Suman</td>
            <td>89</td>
            <td>65</td>
            <td>99</td>
            <td>98</td>
            </tr>
            <tr>
            <td>Mohan</td>
            <td>78</td>
            <td>89</td>
            <td>65</td>
            <td>73</td>
            </tr>
            <caption>Student Score</caption>
            </tbody>
            <tfoot>
                <th>Total</th>
            </tfoot>
        </table>
    </div>
    <br> 
    <div>
        <h1>Row and Column Span </h1>
        <table>

             <tr>
                <td rowspan="2"></td>
                <td colspan="2" style="text-align: center;">Average</td>
                <td rowspan="2">Red Eyes</td>
            </tr>
            <tr>
                <td>Height</td>
                <td>Weight</td>
            </tr>
            <tr>
                <td>Male</td>
                <td>1.9</td>
                <td>0.003</td>
                <td>40%</td>
            </tr>
            <tr>
                <td>Female</td>
                <td>1.9</td>
                <td>0.002</td>
                <td>43</td>
            </tr>
            <caption>A tabel test merge cells</caption>
        </table>
    </div>
    <br>
   
</body>
</html>
