<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Form</title>
</head>
<body>
  
    <div>
        <h1 style="text-align: center;">Pete's Pizza Delivery</h1>
        <h2 style="text-align: center;">Online Order Form</h2>
          <h6 style="text-align: center;">*required fields</h6>
          <h1>This is demo for checking box</h1>
        <form action="">
          <fieldset>
            <label for="Name">Name:</label>
            <input type="text" id="Name" placeholder="Enter Name" required><br><br>

            <label for="address">Address</label>
            <input type="text" id="address" placeholder="Address" required> <br><br>

            <label for="city">Town/city</label>
            <input type="text" id="city" placeholder="city" required> <br><br>

            <label for="number">Post Code: </label>
            <input type="number" id="number" placeholder="PostCode" required min="0"> <br><br>

            <label for="tel">Tel: </label>
            <input type="number" id="tel" placeholder="Tel Number" required min="0"> <br><br>

            <label for="email">Enter Email</label>
            <input type="email" id="email" placeholder="Email" required>
            <legend>Custmer details</legend>
            <div style="justify-content: center; align-items: center; display: flex;">              
                                                 
          </fieldset>
          <div> 
          <fieldset>
            <input type="radio">Margherita    <br>
            <input type="radio">Four Seasons <br>
            <input type="radio">Meat Feast <br>
            <legend>Topping*</legend>
          </fieldset>
          </div>
          <div> 
          <fieldset>
            <input type="radio"> small <br>
            <input type="radio"> Medium <br>
            <input type="radio"> Large <br>
            <legend>Size*</legend>
          </fieldset>
          </div>
          <div> 
          <fieldset>
          <input type="checkbox"> Mushrooms <br>
          <input type="checkbox"> Green peppers <br>
          <input type="checkbox"> Anchovies <br>
          <input type="checkbox"> Extra cheese <br>
          <legend>Extra</legend>
          </fieldset>
          </div>
          </div>
          <fieldset>
            <legend>Delivery</legend>
            Preferred delivery time <input type="time"> <br>
            Delivery instruction:
            <textarea name="details" id="comment"></textarea>
          </fieldset>
        </form>
    </div>
</body>
</html>
